        custom_items: Array.isArray(value.rewards.custom_items) ? clone(value.rewards.custom_items) : [],
        redemptions: Array.isArray(value.rewards.redemptions) ? clone(value.rewards.redemptions) : []
      };
    }
    base.family_tasks = Array.isArray(value.family_tasks) ? clone(value.family_tasks) : [];
    base.history = Array.isArray(value.history) ? value.history.slice(-500) : [];
    base.last_view = typeof value.last_view === "string" ? value.last_view : "home";
    return base;
  }

  function packForRound(product, round) {
    const rounds = product.recommendation_plan.rounds;
    return rounds[round % rounds.length].slice();
  }

  function localDateKey(value) {
    if (typeof value === "string" && /^\d{4}-\d{2}-\d{2}$/.test(value)) return value;
    const date = value instanceof Date ? value : new Date(value || Date.now());
    const year = date.getFullYear();
    const month = String(date.getMonth() + 1).padStart(2, "0");
    const day = String(date.getDate()).padStart(2, "0");
    return `${year}-${month}-${day}`;
  }

  function stableHash(value) {
    let hash = 2166136261;
    for (const character of String(value)) {
      hash ^= character.codePointAt(0);
      hash = Math.imul(hash, 16777619);
    }
    return hash >>> 0;
  }

  function dailyContentPack(state, items, dateValue) {
    const dateKey = localDateKey(dateValue);
    const byId = Object.fromEntries(items.map((item) => [item.item_id, item]));
    const cached = state.daily_content_packs[dateKey];
    if (Array.isArray(cached) && cached.length === 3 && new Set(cached).size === 3 && cached.every((itemId) => byId[itemId])) {
      return cached.slice();
    }

    const recentKeys = Object.keys(state.daily_content_packs).filter((key) => key < dateKey).sort().slice(-2);
    const recentIds = new Set(recentKeys.flatMap((key) => state.daily_content_packs[key] || []));
    const recentFamilies = new Set([...recentIds].map((itemId) => byId[itemId]?.family_id).filter(Boolean));
    const selected = [];
    const selectedFamilies = new Set();
    const levels = ["foundation", "guided", "transfer"];

    for (const level of levels) {
      let candidates = items.filter((item) => item.level === level && !selectedFamilies.has(item.family_id));
      if (!candidates.length) candidates = items.filter((item) => item.level === level && !selected.includes(item.item_id));
      candidates.sort((left, right) => {
        const leftDone = state.content_items[left.item_id]?.resolved || state.content_items[left.item_id]?.guardian_confirmed ? 1 : 0;
        const rightDone = state.content_items[right.item_id]?.resolved || state.content_items[right.item_id]?.guardian_confirmed ? 1 : 0;
        const leftRank = [leftDone, recentFamilies.has(left.family_id) ? 1 : 0, recentIds.has(left.item_id) ? 1 : 0, stableHash(`${dateKey}:${left.item_id}`)];
        const rightRank = [rightDone, recentFamilies.has(right.family_id) ? 1 : 0, recentIds.has(right.item_id) ? 1 : 0, stableHash(`${dateKey}:${right.item_id}`)];
        for (let index = 0; index < leftRank.length; index += 1) {
          if (leftRank[index] !== rightRank[index]) return leftRank[index] - rightRank[index];
        }
        return left.item_id.localeCompare(right.item_id);
      });
      const choice = candidates[0];
      if (choice) {
        selected.push(choice.item_id);
        selectedFamilies.add(choice.family_id);
      }
    }

    state.daily_content_packs[dateKey] = selected;
    const retainedKeys = Object.keys(state.daily_content_packs).sort().slice(-14);
    state.daily_content_packs = Object.fromEntries(retainedKeys.map((key) => [key, state.daily_content_packs[key]]));
    state.history.push({ event: "daily_content_pack_created", date: dateKey, item_ids: selected.slice(), affects_mastery: false, at: new Date().toISOString() });
    state.history = state.history.slice(-500);
    return selected.slice();
  }

  function ensureLearningPathState(state, path, dateKey) {
    if (!state.learning_path || state.learning_path.path_id !== path.path_id) {
      state.learning_path = {
        path_id: path.path_id,
        next_ordinal: 1,
        day_by_date: {},
        adaptive_by_date: {},
        adaptive_atom_last_scheduled: {}
      };
      state.daily_content_packs = {};
      state.history.push({ event: "learning_path_activated", path_id: path.path_id, date: dateKey, affects_mastery: false, at: new Date().toISOString() });
      state.history = state.history.slice(-500);
    }
    return state.learning_path;
  }

  function contentDone(state, itemId) {
    const row = state.content_items[itemId];
    return Boolean(row && (row.resolved || row.guardian_confirmed));
  }

  function currentLearningOrdinal(state) {
    const rows = Object.values(state.learning_path?.day_by_date || {});
    return rows.reduce((maximum, row) => Math.max(maximum, Number(row?.ordinal) || 0), 0);
  }

  function currentLearningAssignment(state) {
    const entries = Object.entries(state.learning_path?.day_by_date || {});
    entries.sort((left, right) => {
      const ordinalDelta = (Number(right[1]?.ordinal) || 0) - (Number(left[1]?.ordinal) || 0);
      return ordinalDelta || right[0].localeCompare(left[0]);
    });
    const current = entries[0];
    return current ? { date_key: current[0], ordinal: Number(current[1]?.ordinal) || 0 } : { date_key: null, ordinal: 0 };
  }

  function targetAtoms(item) {
    return Array.isArray(item?.target_atom_ids) ? item.target_atom_ids : [];
  }

  function adaptiveFollowUpPack(state, items, path, primaryItemIds, atomCatalog) {
    const contract = path.adaptive_follow_up;
    if (!contract) return { item_ids: [], reasons: {}, roles: {}, triggers: {}, evidence: {}, atom_ids: {}, daily_item_limit: 0, remaining_slots: 0 };
    const byId = Object.fromEntries(items.map((item) => [item.item_id, item]));
    const currentAssignment = currentLearningAssignment(state);
    const currentOrdinal = currentAssignment.ordinal;
    const dateKey = currentAssignment.date_key;
    if (!dateKey) return { item_ids: [], reasons: {}, roles: {}, triggers: {}, evidence: {}, atom_ids: {}, daily_item_limit: Number(contract.daily_item_limit) || 0, remaining_slots: Number(contract.daily_item_limit) || 0 };
    const pathState = state.learning_path;
    pathState.adaptive_by_date = pathState.adaptive_by_date && typeof pathState.adaptive_by_date === "object" ? pathState.adaptive_by_date : {};
    pathState.adaptive_atom_last_scheduled = pathState.adaptive_atom_last_scheduled && typeof pathState.adaptive_atom_last_scheduled === "object" ? pathState.adaptive_atom_last_scheduled : {};
    const dailyLimit = Number(contract.daily_item_limit) || 0;
    const cached = pathState.adaptive_by_date[dateKey];
    const cachedValid = cached
      && Number(cached.ordinal) === currentOrdinal
      && Array.isArray(cached.item_ids)
      && cached.item_ids.length <= dailyLimit
      && new Set(cached.item_ids).size === cached.item_ids.length
      && cached.item_ids.every((itemId) => byId[itemId]);
    const dailyAssignment = cachedValid ? cached : {
      ordinal: currentOrdinal,
      item_ids: [],
      reasons: {},
      roles: {},
      triggers: {},
      evidence: {},
      atom_ids: {}
    };
    pathState.adaptive_by_date[dateKey] = dailyAssignment;
    const completed = (itemId) => contentDone(state, itemId);
    const atomRoleItems = contract.atom_role_items || {};
    const wrongAtoms = new Set();
    const wrongMisconceptions = new Set();
    const wrongItemIdsByAtom = {};
    const hintedItemIdsByAtom = {};
    const cleanOrdinalsByAtom = {};
    const cleanTransferOrdinalsByAtom = {};

    function addEvidence(target, atomId, value) {
      if (!target[atomId]) target[atomId] = new Set();
      target[atomId].add(value);
    }

    for (const [itemId, row] of Object.entries(state.content_items || {})) {
      const atomIds = row.target_atom_ids || targetAtoms(byId[itemId]);
      for (const atomId of atomIds) {
        if (row?.first_attempt_correct === false) {
          wrongAtoms.add(atomId);
          addEvidence(wrongItemIdsByAtom, atomId, itemId);
        }
        for (const ordinal of row?.hinted_success_ordinals || []) addEvidence(hintedItemIdsByAtom, atomId, itemId);
        for (const ordinal of row?.clean_success_ordinals || []) addEvidence(cleanOrdinalsByAtom, atomId, Number(ordinal));
        for (const ordinal of row?.clean_transfer_ordinals || []) addEvidence(cleanTransferOrdinalsByAtom, atomId, Number(ordinal));
      }
      if (row?.first_attempt_correct === false) {
        for (const ref of row.detected_misconceptions || []) wrongMisconceptions.add(ref);
      }
    }
    for (const [roundKey, round] of Object.entries(state.atom_rounds || {})) {
      const atomId = roundKey.split(":").slice(1).join(":");
      if (!(atomCatalog || []).some((atom) => atom.atom_id === atomId)) continue;
      for (const [itemId, trial] of Object.entries(round.trials || {})) {
        if (trial?.first_attempt_correct === false) {
          wrongAtoms.add(atomId);
          addEvidence(wrongItemIdsByAtom, atomId, itemId);
        } else if (trial?.first_attempt_correct === true && trial?.hint_used === true) {
          addEvidence(hintedItemIdsByAtom, atomId, itemId);
        }
      }
    }
    const hintedAtoms = new Set(Object.keys(hintedItemIdsByAtom));
    const stableAtoms = new Set(
      Object.keys(cleanOrdinalsByAtom).filter((atomId) => {
        const cleanDays = [...cleanOrdinalsByAtom[atomId]].filter((value) => Number.isInteger(value) && value > 0);
        const cleanTransferDays = [...(cleanTransferOrdinalsByAtom[atomId] || [])].filter((value) => Number.isInteger(value) && value > 0);
        return cleanDays.length >= Number(contract.stable_completion?.minimum_distinct_active_days || 2) && cleanTransferDays.length >= 1;
      })
    );
    const progressedAtoms = new Set();
    for (const [atomId, groups] of Object.entries(atomRoleItems)) {
      const roleItemIds = Object.values(groups || {}).flat();
      if (roleItemIds.some(completed)) progressedAtoms.add(atomId);
    }
    function errorCandidate(atomId) {
      const groups = atomRoleItems[atomId] || {};
      const repairs = groups.misconception_repair || [];
      const targetedRepair = repairs.find((itemId) => (byId[itemId]?.misconception_refs || []).some((ref) => wrongMisconceptions.has(ref)) && !completed(itemId));
      const pendingRepair = targetedRepair || repairs.find((itemId) => !completed(itemId));
      if (pendingRepair) return { item_id: pendingRepair, role: "misconception_repair" };

      const transfers = groups.additional_transfer || [];
      const pendingTransfer = transfers.find((itemId) => !completed(itemId));
      if (pendingTransfer) {
        const repairOrdinals = repairs.map((itemId) => Number(state.content_items[itemId]?.completed_ordinal) || 0).filter(Boolean);
        const lastRepairOrdinal = repairOrdinals.length ? Math.max(...repairOrdinals) : 0;
        if (lastRepairOrdinal && currentOrdinal - lastRepairOrdinal >= contract.minimum_transfer_delay_active_days) {
          return { item_id: pendingTransfer, role: "additional_transfer" };
        }
        return null;
      }

      const constructed = groups.constructed_response || [];
      const pendingConstructed = constructed.find((itemId) => !completed(itemId));
      if (pendingConstructed && transfers.every(completed)) return { item_id: pendingConstructed, role: "constructed_response" };

      const offscreen = groups.structured_offscreen_expression || [];
      const pendingOffscreen = offscreen.find((itemId) => !completed(itemId));
      const prior = constructed.length ? constructed : transfers;
      if (pendingOffscreen && prior.every(completed)) return { item_id: pendingOffscreen, role: "structured_offscreen_expression" };
      return null;
    }

    function hintedCandidate(atomId) {
      const groups = atomRoleItems[atomId] || {};
      const constructed = groups.constructed_response || [];
      const pendingConstructed = constructed.find((itemId) => !completed(itemId));
      if (pendingConstructed) return { item_id: pendingConstructed, role: "constructed_response", reason_key: "hint_to_constructed" };
      if (constructed.length && constructed.every(completed)) return null;
      const pendingTransfer = (groups.additional_transfer || []).find((itemId) => !completed(itemId));
      if (pendingTransfer) return { item_id: pendingTransfer, role: "additional_transfer", reason_key: "hint_to_transfer_fallback" };
      return null;
    }

    function stableCandidate(atomId) {
      const groups = atomRoleItems[atomId] || {};
      const pendingOffscreen = (groups.structured_offscreen_expression || []).find((itemId) => !completed(itemId));
      if (pendingOffscreen) return { item_id: pendingOffscreen, role: "structured_offscreen_expression", reason_key: "stable_to_offscreen" };
      const pendingTransfer = (groups.additional_transfer || []).find((itemId) => !completed(itemId));
      if (pendingTransfer) return { item_id: pendingTransfer, role: "additional_transfer", reason_key: "stable_to_transfer_summary" };
      return null;
    }

    function progressedCandidate(atomId) {
      const groups = atomRoleItems[atomId] || {};
      const repairs = groups.misconception_repair || [];
      const transfers = groups.additional_transfer || [];
      const constructed = groups.constructed_response || [];
      const offscreen = groups.structured_offscreen_expression || [];
      if (repairs.some(completed)) {
        const pendingRepair = repairs.find((itemId) => !completed(itemId));
        if (pendingRepair) return { item_id: pendingRepair, role: "misconception_repair" };
        const pendingTransfer = transfers.find((itemId) => !completed(itemId));
        if (pendingTransfer) {
          const lastRepairOrdinal = Math.max(...repairs.map((itemId) => Number(state.content_items[itemId]?.completed_ordinal) || 0));
          if (lastRepairOrdinal && currentOrdinal - lastRepairOrdinal >= contract.minimum_transfer_delay_active_days) {
            return { item_id: pendingTransfer, role: "additional_transfer" };
          }
          return null;
        }
      }
      if (transfers.length && transfers.every(completed)) {
        const pendingConstructed = constructed.find((itemId) => !completed(itemId));
        if (pendingConstructed) return { item_id: pendingConstructed, role: "constructed_response" };
      }
      if ((constructed.length && constructed.every(completed)) || (!constructed.length && transfers.length && transfers.every(completed))) {
        const pendingOffscreen = offscreen.find((itemId) => !completed(itemId));
        if (pendingOffscreen) return { item_id: pendingOffscreen, role: "structured_offscreen_expression" };
      }
      return null;
    }

    const assignedAtoms = new Set(Object.values(dailyAssignment.atom_ids || {}));
    const assignedItems = new Set(dailyAssignment.item_ids || []);
    const primaryItems = new Set(primaryItemIds || []);
    const atomIds = [...wrongAtoms, ...hintedAtoms, ...stableAtoms, ...progressedAtoms]
      .filter((atomId, index, rows) => rows.indexOf(atomId) === index && !assignedAtoms.has(atomId));
    const candidateRows = [];
    for (const atomId of atomIds) {
      const options = [];
      if (wrongAtoms.has(atomId)) options.push({ trigger: "real_error", priority: 0, candidate: errorCandidate(atomId) });
      if (hintedAtoms.has(atomId)) options.push({ trigger: "explicit_hint_dependency", priority: 1, candidate: hintedCandidate(atomId) });
      if (stableAtoms.has(atomId)) options.push({ trigger: "stable_clean_completion", priority: 2, candidate: stableCandidate(atomId) });
      if (progressedAtoms.has(atomId)) options.push({ trigger: "existing_branch_progress", priority: 3, candidate: progressedCandidate(atomId) });
      const chosen = options.find((row) => row.candidate && !assignedItems.has(row.candidate.item_id) && !primaryItems.has(row.candidate.item_id));
      if (chosen) candidateRows.push({ atom_id: atomId, ...chosen });
    }
    candidateRows.sort((left, right) => {
      if (left.priority !== right.priority) return left.priority - right.priority;
      const leftLast = Number(pathState.adaptive_atom_last_scheduled[left.atom_id]) || 0;
      const rightLast = Number(pathState.adaptive_atom_last_scheduled[right.atom_id]) || 0;
      if (leftLast !== rightLast) return leftLast - rightLast;
      return left.atom_id.localeCompare(right.atom_id);
    });

    for (const row of candidateRows) {
      if (dailyAssignment.item_ids.length >= dailyLimit) break;
      const atomId = row.atom_id;
      const trigger = row.trigger;
      const candidate = row.candidate;
      dailyAssignment.item_ids.push(candidate.item_id);
      dailyAssignment.roles[candidate.item_id] = candidate.role;
      dailyAssignment.triggers[candidate.item_id] = trigger;
      dailyAssignment.atom_ids[candidate.item_id] = atomId;
      const reasonKey = candidate.reason_key || candidate.role;
      dailyAssignment.reasons[candidate.item_id] = contract.reason_copy?.[reasonKey] || contract.reason_copy?.[candidate.role] || "按前面的练习结果安排下一步。";
      dailyAssignment.evidence[candidate.item_id] = {
        atom_id: atomId,
        trigger,
        wrong_item_ids: [...(wrongItemIdsByAtom[atomId] || [])],
        hinted_item_ids: [...(hintedItemIdsByAtom[atomId] || [])],
        clean_success_ordinals: [...(cleanOrdinalsByAtom[atomId] || [])].sort((left, right) => left - right),
        clean_transfer_ordinals: [...(cleanTransferOrdinalsByAtom[atomId] || [])].sort((left, right) => left - right)
      };
      pathState.adaptive_atom_last_scheduled[atomId] = currentOrdinal;
      assignedAtoms.add(atomId);
      assignedItems.add(candidate.item_id);
      state.history.push({
        event: "adaptive_follow_up_scheduled",
        path_id: path.path_id,
        date: dateKey,
        ordinal: currentOrdinal,
        atom_id: atomId,
        item_id: candidate.item_id,
        role: candidate.role,
        trigger,
        affects_mastery: false,
        at: new Date().toISOString()
      });
    }
    const retainedDates = Object.keys(pathState.adaptive_by_date).sort().slice(-60);
    pathState.adaptive_by_date = Object.fromEntries(retainedDates.map((key) => [key, pathState.adaptive_by_date[key]]));
    state.history = state.history.slice(-500);
    return {
      item_ids: dailyAssignment.item_ids.slice(),
      reasons: clone(dailyAssignment.reasons),
      roles: clone(dailyAssignment.roles),
      triggers: clone(dailyAssignment.triggers),
      evidence: clone(dailyAssignment.evidence),
      atom_ids: clone(dailyAssignment.atom_ids),
      date_key: dateKey,
      ordinal: currentOrdinal,
      daily_item_limit: dailyLimit,
      remaining_slots: Math.max(0, dailyLimit - dailyAssignment.item_ids.length),
      ordering_policy: "trigger_priority_then_oldest_last_scheduled_then_atom_id",
      frozen_for_active_day: true
    };
  }

  function adaptivePathItems(state, items, day, ordinal) {
    const allowedLevels = day.selection_rule?.levels;
    const candidates = items.filter((item) => !allowedLevels || allowedLevels.includes(item.level));
    candidates.sort((left, right) => {
      const leftRow = state.content_items[left.item_id] || {};
      const rightRow = state.content_items[right.item_id] || {};
      const leftRank = [leftRow.first_attempt_correct === false ? 0 : 1, contentDone(state, left.item_id) ? 1 : 0, leftRow.updated_at || "", stableHash(`${ordinal}:${left.item_id}`)];
      const rightRank = [rightRow.first_attempt_correct === false ? 0 : 1, contentDone(state, right.item_id) ? 1 : 0, rightRow.updated_at || "", stableHash(`${ordinal}:${right.item_id}`)];
      for (let index = 0; index < leftRank.length; index += 1) {
        if (leftRank[index] < rightRank[index]) return -1;
        if (leftRank[index] > rightRank[index]) return 1;
      }
      return left.item_id.localeCompare(right.item_id);
    });
    const selected = [];
    const families = new Set();
    for (const item of candidates) {
      if (families.has(item.family_id)) continue;
      selected.push(item.item_id);
      families.add(item.family_id);
      if (selected.length === day.selection_rule.item_count) break;
    }
    return selected;
  }

  function dailyLearningPathPack(state, items, path, dateValue) {
    const dateKey = localDateKey(dateValue);
    const byId = Object.fromEntries(items.map((item) => [item.item_id, item]));
    const pathState = ensureLearningPathState(state, path, dateKey);
    if (!pathState.day_by_date[dateKey]) {
      const ordinal = pathState.next_ordinal;
      const dayInCycle = ((ordinal - 1) % path.active_day_count) + 1;
      const cycle = Math.floor((ordinal - 1) / path.active_day_count) + 1;
      pathState.day_by_date[dateKey] = { ordinal, day_in_cycle: dayInCycle, cycle };
      pathState.next_ordinal += 1;
    }
    const assignment = pathState.day_by_date[dateKey];
    const day = path.days.find((candidate) => candidate.day === assignment.day_in_cycle);
    if (!day) throw new Error(`learning path day missing: ${assignment.day_in_cycle}`);
    let itemIds = state.daily_content_packs[dateKey];
    const cachedValid = Array.isArray(itemIds) && itemIds.length === path.daily_item_count && new Set(itemIds).size === path.daily_item_count && itemIds.every((itemId) => byId[itemId]);
    if (!cachedValid) {
      itemIds = Array.isArray(day.slots) ? day.slots.map((slot) => slot.item_id) : adaptivePathItems(state, items, day, assignment.ordinal);
      if (itemIds.length !== path.daily_item_count || new Set(itemIds.map((itemId) => byId[itemId]?.family_id)).size !== path.daily_item_count) {
        throw new Error(`learning path day invalid: ${assignment.day_in_cycle}`);
      }
      state.daily_content_packs[dateKey] = itemIds.slice();
      state.history.push({
        event: "learning_path_day_created",
        path_id: path.path_id,
        date: dateKey,
        ordinal: assignment.ordinal,
        day_in_cycle: assignment.day_in_cycle,
        cycle: assignment.cycle,
        phase: day.phase,
        item_ids: itemIds.slice(),
        affects_mastery: false,
        at: new Date().toISOString()
      });
      state.history = state.history.slice(-500);
    }
    return {
      path_id: path.path_id,
      ordinal: assignment.ordinal,
      day_in_cycle: assignment.day_in_cycle,
      cycle: assignment.cycle,
      phase: day.phase,
      phase_label: day.phase_label,
      title: day.title,
      description: day.description,
      item_ids: itemIds.slice()
    };
  }

  function parentPathExplanation(state, items, pathDay, follow) {
    const byId = Object.fromEntries(items.map((item) => [item.item_id, item]));
    const ordinal = Number(pathDay?.ordinal) || currentLearningOrdinal(state) || 1;
    const todayItemIds = Array.isArray(pathDay?.item_ids) ? pathDay.item_ids : [];
    const followItemIds = Array.isArray(follow?.item_ids) ? follow.item_ids : [];

    function itemStatus(itemId) {
      const row = state.content_items?.[itemId] || {};
      if (row.guardian_confirmed || row.resolved) return "completed";
      if ((Number(row.attempts) || 0) > 0) return "started";
      return "scheduled";
    }

    const today = todayItemIds.map((itemId) => {
      const item = byId[itemId] || {};
      const row = state.content_items?.[itemId] || {};
      const explicitHintToday = (row.hinted_success_ordinals || []).includes(ordinal);
      return {
        item_id: itemId,
        status: itemStatus(itemId),
        level: item.level || null,
        mode: item.mode || null,
        guided_only: item.level === "guided" || item.mode === "guided_practice",
        explicit_hint_today: explicitHintToday,
        first_attempt_incorrect: row.first_attempt_correct === false
      };
    });

    const correction = followItemIds
      .filter((itemId) => follow.triggers?.[itemId] === "real_error" && follow.roles?.[itemId] === "misconception_repair")
      .map((itemId) => ({
        item_id: itemId,
        source_item_ids: (follow.evidence?.[itemId]?.wrong_item_ids || []).filter((sourceId) => byId[sourceId]),
        reason: follow.reasons?.[itemId] || "本机记录中有一次首次作答未通过，因此安排另一种方式再练。"
      }));
    const transfer = followItemIds
      .filter((itemId) => follow.roles?.[itemId] === "additional_transfer")
      .map((itemId) => ({
        item_id: itemId,
        trigger: follow.triggers?.[itemId] || "existing_branch_progress",
        reason: follow.reasons?.[itemId] || "前面的步骤已完成，换个情境再试一次。"
      }));
    const production = followItemIds
      .filter((itemId) => follow.roles?.[itemId] === "constructed_response")
      .map((itemId) => ({
        item_id: itemId,
        trigger: follow.triggers?.[itemId] || "existing_branch_progress",
        reason: follow.reasons?.[itemId] || "前面的步骤已完成，现在自己组织一次答案。"
      }));
    const prompted = today
      .filter((row) => row.guided_only || row.explicit_hint_today)
      .map((row) => ({
        item_id: row.item_id,
        basis: row.explicit_hint_today ? "explicit_hint_used" : "scheduled_guided_practice",
        counts_as_mastery: false
      }));
    for (const itemId of followItemIds) {
      if (follow.triggers?.[itemId] !== "explicit_hint_dependency") continue;
      const sourceIds = (follow.evidence?.[itemId]?.hinted_item_ids || []).filter((sourceId) => byId[sourceId]);
      for (const sourceId of sourceIds) {
        if (!prompted.some((row) => row.item_id === sourceId)) {
          prompted.push({ item_id: sourceId, basis: "explicit_hint_used", counts_as_mastery: false });
        }
      }
    }
    const offscreen = [
      ...today.filter((row) => row.mode === "offscreen_action").map((row) => ({ item_id: row.item_id, source: "daily_path" })),
      ...followItemIds
        .filter((itemId) => follow.roles?.[itemId] === "structured_offscreen_expression")
        .map((itemId) => ({ item_id: itemId, source: "adaptive_follow_up", reason: follow.reasons?.[itemId] || "把方法带到身边用一次。" }))
    ].filter((row, index, rows) => rows.findIndex((candidate) => candidate.item_id === row.item_id) === index);

    return {
      ordinal,
      today,
      correction,
      transfer,
      production,
      prompted,
      offscreen,
      diagnostic_claims: false,
      affects_mastery: false
    };
  }

  function ensureAtomRound(state, atomId) {
    const key = `${state.current_round}:${atomId}`;
    if (!state.atom_rounds[key]) {
      state.atom_rounds[key] = { started: false, item_index: 0, trials: {}, finished: false };
    }
    return state.atom_rounds[key];
  }

  function recordAttempt(state, atom, item, payload) {
    const round = ensureAtomRound(state, atom.atom_id);
    round.started = true;
    if (!round.trials[item.item_id]) {
      round.trials[item.item_id] = {
        first_attempt_correct: Boolean(payload.correct),
        hint_used: Boolean(payload.hint_used),
        resolved: Boolean(payload.correct),
        attempts: 1,
        transfer: Boolean(item.transfer)
      };
    } else {
      const trial = round.trials[item.item_id];
      trial.attempts += 1;
      trial.resolved = trial.resolved || Boolean(payload.correct);
      trial.hint_used = trial.hint_used || Boolean(payload.hint_used);
    }
    if (payload.correct) {
      round.item_index = Math.min(atom.practice.items.length, round.item_index + 1);
      round.finished = round.item_index >= atom.practice.items.length;
    }
    state.history.push({
      event: "practice_attempt",
      atom_id: atom.atom_id,
      item_id: item.item_id,
      correct: Boolean(payload.correct),
      at: payload.at || new Date().toISOString()
    });
    state.history = state.history.slice(-500);
    return clone(round);
  }

  function evaluateRoundEvidence(state, atom, roundIndex) {
    const round = state.atom_rounds[`${roundIndex}:${atom.atom_id}`] || { started: false, item_index: 0, trials: {}, finished: false };
    const trials = Object.values(round.trials);
    const correct = trials.filter((trial) => trial.first_attempt_correct).length;
    const transferTrial = trials.find((trial) => trial.transfer);
    const hints = trials.filter((trial) => trial.hint_used).length;
    const oracle = atom.mastery_oracle;
    const pass = round.finished
      && trials.length >= oracle.min_scored_trials
      && correct >= oracle.min_correct
      && (!oracle.required_transfer_correct || Boolean(transferTrial && transferTrial.first_attempt_correct))
      && hints <= oracle.max_hints;
    return {
      state: pass ? oracle.pass_state : oracle.fail_state,
      pass,
      finished: round.finished,
      scored_trials: trials.length,
      correct,
      required_correct: oracle.min_correct,
      transfer_correct: Boolean(transferTrial && transferTrial.first_attempt_correct),
      hints,
      max_hints: oracle.max_hints
    };
  }

  function evaluateEvidence(state, atom) {
    return evaluateRoundEvidence(state, atom, state.current_round);
  }

  function hasPassedEvidence(state, atom) {
    for (let round = 0; round <= state.current_round; round += 1) {
      if (evaluateRoundEvidence(state, atom, round).pass) return true;
    }
    return false;
  }

  function verifyAtom(state, product, atom, at) {
    const evidence = evaluateEvidence(state, atom);
    const round = state.current_round;
    const key = `${round}:${atom.atom_id}`;
    if (!evidence.pass) return { changed: false, reason: "evidence_not_sufficient", restored: false };
    if (state.verifications[key]) return { changed: false, reason: "already_verified", restored: state.restored_rounds.includes(round) };
    state.verifications[key] = { at: at || new Date().toISOString(), evidence: clone(evidence) };
    state.history.push({ event: "guardian_verified", atom_id: atom.atom_id, round, at: at || new Date().toISOString() });
    const pack = packForRound(product, round);
    const allVerified = pack.every((atomId) => Boolean(state.verifications[`${round}:${atomId}`]));
    let restored = false;
    if (allVerified && !state.restored_rounds.includes(round)) {
      state.restored_rounds.push(round);
      state.history.push({ event: "garden_restored", round, at: at || new Date().toISOString() });
      restored = true;
    }
    return { changed: true, reason: "verified", restored };
  }

  function defenseProjection(state, product) {
    const round = state.current_round;
    const pack = packForRound(product, round);
    const verified = pack.filter((atomId) => state.verifications[`${round}:${atomId}`]).length;
    return {
      round,
      required: pack.length,
      verified,
      restored: state.restored_rounds.includes(round),
      phase: state.restored_rounds.includes(round) ? "restored" : verified === 0 ? "watch" : verified < pack.length ? "repairing" : "restored"
    };
  }

  function resetAtomRound(state, atomId) {
    delete state.atom_rounds[`${state.current_round}:${atomId}`];
    const prefix = `${state.current_round}:${atomId}`;
    delete state.verifications[prefix];
    state.restored_rounds = state.restored_rounds.filter((round) => round !== state.current_round);
    state.history.push({ event: "atom_round_reset", atom_id: atomId, round: state.current_round, at: new Date().toISOString() });
  }

  function recordContentAttempt(state, item, payload) {
    const current = state.content_items[item.item_id] || {
      mode: item.mode,
      attempts: 0,
      first_attempt_correct: null,
      resolved: false,
      guardian_confirmed: false
    };
    current.attempts += 1;
    if (current.first_attempt_correct === null && item.mode !== "offscreen_action") {
      current.first_attempt_correct = Boolean(payload.correct);
    }
    current.resolved = current.resolved || Boolean(payload.correct);
    current.guardian_confirmed = current.guardian_confirmed || Boolean(payload.guardian_confirmed);
    current.hint_used_ever = current.hint_used_ever || Boolean(payload.hint_used);
    current.content_role = item.content_role || "curated_base";
    current.target_atom_ids = targetAtoms(item);
    current.misconception_refs = Array.isArray(item.misconception_refs) ? item.misconception_refs.slice() : [];
    if (payload.answer !== undefined) current.last_answer = clone(payload.answer);
    if (payload.detected_misconception) {
      current.detected_misconceptions = [...new Set([...(current.detected_misconceptions || []), payload.detected_misconception])];
    }
    if ((current.resolved || current.guardian_confirmed) && !current.completed_ordinal) {
      current.completed_ordinal = Number(payload.path_ordinal) || currentLearningOrdinal(state) || 1;
    }
    const ordinal = Number(payload.path_ordinal) || currentLearningOrdinal(state) || 1;
    if (payload.correct && payload.hint_used) {
      current.hinted_success_ordinals = [...new Set([...(current.hinted_success_ordinals || []), ordinal])].sort((left, right) => left - right);
    }
    if (payload.correct && !payload.hint_used && !item.content_role) {
      current.clean_success_ordinals = [...new Set([...(current.clean_success_ordinals || []), ordinal])].sort((left, right) => left - right);
      if (item.level === "transfer") {
        current.clean_transfer_ordinals = [...new Set([...(current.clean_transfer_ordinals || []), ordinal])].sort((left, right) => left - right);
      }
    }
    current.updated_at = payload.at || new Date().toISOString();
    state.content_items[item.item_id] = current;
    state.history.push({
      event: item.mode === "offscreen_action" ? "supplemental_offscreen_confirmation" : "supplemental_content_attempt",
      item_id: item.item_id,
      mode: item.mode,
      correct: Boolean(payload.correct),
      hint_used: Boolean(payload.hint_used),
      guardian_confirmed: Boolean(payload.guardian_confirmed),
      affects_mastery: false,
      at: current.updated_at
    });
    state.history = state.history.slice(-500);
    return clone(current);
  }

  function advanceRound(state, product) {
    const projection = defenseProjection(state, product);
    if (!projection.restored) return false;
    state.current_round += 1;
    state.last_view = "home";
    state.history.push({ event: "round_advanced", round: state.current_round, at: new Date().toISOString() });
    return true;
  }

  root.ChildLearningProductEngine = {
    STORAGE_SCHEMA,
    createState,
    normalizeState,
    packForRound,
    localDateKey,
    dailyContentPack,
    dailyLearningPathPack,
    adaptiveFollowUpPack,
    parentPathExplanation,
    currentLearningOrdinal,
    ensureAtomRound,
    recordAttempt,
    evaluateEvidence,
    evaluateRoundEvidence,
    hasPassedEvidence,
    verifyAtom,
    defenseProjection,
    resetAtomRound,
    recordContentAttempt,
    advanceRound
  };
})(typeof globalThis !== "undefined" ? globalThis : window);

ack">${pack.map(a=>card(a)).join("")}</div>${ENGINE.defenseProjection(state,PRODUCT).restored?`<div class="boundary"><strong>这一轮完成啦。</strong><br>休息好了，再去下一轮。<div style="margin-top:12px"><button class="primary" data-next-round>下一轮</button></div></div>`:""}`}

function parentItemTitle(itemId){const supplemental=contentItems[itemId];if(supplemental)return supplemental.title;for(const atom of CATALOG.atoms){const item=atom.practice.items.find(row=>row.item_id===itemId);if(item)return ITEM_PROMPTS[itemId]||item.prompt||guide(atom).title}return"一次过关练习"}
function parentEmpty(text){return `<p class="parent-empty">${esc(text)}</p>`}
function renderParentPath(pathDay,follow){const explanation=ENGINE.parentPathExplanation(state,PACK.items,pathDay,follow);const today=explanation.today.map(row=>`<li data-parent-today-item="${esc(row.item_id)}"><div class="parent-fact"><b>${esc(parentItemTitle(row.item_id))}</b><span class="content-chip">${esc(PARENT_STATUS_LABELS[row.status])}</span></div><small>${esc(contentItems[row.item_id]?.family_name||"")} · ${esc(contentItems[row.item_id]?.level_label||"")}</small></li>`).join("");const correction=explanation.correction.map(row=>`<li data-parent-correction="${esc(row.item_id)}" data-parent-source="${esc(row.source_item_ids.join(","))}"><b>${row.source_item_ids.map(parentItemTitle).map(esc).join("、")||"一次首次作答"} → ${esc(parentItemTitle(row.item_id))}</b><span class="parent-evidence">${esc(row.reason)}</span></li>`).join("");const transfer=explanation.transfer.map(row=>`<li data-parent-transfer="${esc(row.item_id)}"><b>${esc(parentItemTitle(row.item_id))}</b><span class="parent-evidence">${esc(row.reason)}</span></li>`).join("");const production=explanation.production.map(row=>`<li data-parent-production="${esc(row.item_id)}"><b>${esc(parentItemTitle(row.item_id))}</b><span class="parent-evidence">${esc(row.reason)}</span></li>`).join("");const prompted=explanation.prompted.map(row=>`<li data-parent-prompted="${esc(row.item_id)}"><b>${esc(parentItemTitle(row.item_id))}</b><span class="parent-evidence">${row.basis==="explicit_hint_used"?"本机记录显示今天主动打开过提示。":"这是路径预先安排的带提示练习。"}这项只算练习记录，不单独作为掌握证据。</span></li>`).join("");const offscreen=explanation.offscreen.map(row=>`<li data-parent-offscreen="${esc(row.item_id)}"><b>${esc(parentItemTitle(row.item_id))}</b><span class="parent-evidence">${esc(row.reason||"建议在身边找一个真实对象或场景再试一次，由家长现场确认。")}</span></li>`).join("");return `<section class="parent-path" data-parent-path-explanation data-learning-ordinal="${explanation.ordinal}"><div class="parent-path-head"><div><p class="eyeline">第 ${explanation.ordinal} 个学习日</p><h2>为什么今天安排这些</h2><p>只引用这台设备上的安排和作答记录，不推断孩子的能力、性格或长期效果。</p></div><span class="content-chip">本机行为依据</span></div><div class="parent-explain-grid"><article class="parent-explain-card today" data-parent-section="today"><h3>今天练了什么</h3><ul>${today}</ul></article><article class="parent-explain-card" data-parent-section="correction"><h3>哪一题触发纠正</h3><ul>${correction}</ul>${correction?"":parentEmpty("今天没有由首次答错触发的纠正安排。")}</article><article class="parent-explain-card" data-parent-section="transfer"><h3>为什么随后安排迁移</h3><ul>${transfer}</ul>${transfer?"":parentEmpty("今天没有达到延迟迁移的安排条件。")}</article><article class="parent-explain-card" data-parent-section="production"><h3>为什么安排自己表达</h3><ul>${production}</ul>${production?"":parentEmpty("今天还没有进入自己组织答案的步骤。")}</article><article class="parent-explain-card" data-parent-section="prompted"><h3>哪些只是带提示练习</h3><ul>${prompted}</ul>${prompted?"":parentEmpty("今天没有路径带提示项，也没有主动打开提示的记录。")}</article><article class="parent-explain-card" data-parent-section="offscreen"><h3>哪些建议在生活中再试</h3><ul>${offscreen}</ul>${offscreen?"":parentEmpty("今天没有安排屏外应用；不需要额外加任务。")}</article></div><p class="parent-boundary">这些说明不会改变花园过关，也不能代替老师评估；“答错、点提示、完成”只描述一次本机行为。</p></section>`}
function renderParent(){const pack=ENGINE.packForRound(PRODUCT,state.current_round).map(id=>atoms[id]);const baseItems=PACK.items.filter(item=>!item.content_role);const pathDay=ENGINE.dailyLearningPathPack(state,baseItems,LEARNING_PATH);const follow=ENGINE.adaptiveFollowUpPack(state,PACK.items,LEARNING_PATH,pathDay.item_ids,CATALOG.atoms);document.getElementById("app-main").innerHTML=top("家长回顾","安排依据与过关确认")+renderParentPath(pathDay,follow)+`<div class="section-head"><div><h2>这一轮的过关确认</h2><p>只核对当前四道练习的实际记录。</p></div></div><div class="parent-note"><strong>确认规则：</strong>四个标记都变绿，才可以点“确认完成”。</div><div class="review-list">${pack.map(a=>{const e=evidence(a),v=verified(a.atom_id),checks=[[e.scored_trials===4,"4题做完"],[e.correct>=e.required_correct,"首次作答达标"],[e.transfer_correct,"迁移题通过"],[e.hints===0&&e.scored_trials===4,"未用提示"]];return `<article class="review"><div><h3>${esc(guide(a).title)}</h3><div class="parent-checks">${checks.map(c=>`<span class="parent-check ${c[0]?"ok":""}">${c[0]?"✓":"○"} ${c[1]}</span>`).join("")}</div></div><button class="${v?"secondary":"primary"}" data-verify="${a.atom_id}" ${!e.pass||v?"disabled":""}>${v?"已确认":e.pass?"确认完成":"还没完成"}</button></article>`}).join("")}</div>${garden()}`}
function renderData(){const records=state.history.length;document.getElementById("app-main").innerHTML=top("本机数据","备份与恢复")+`<section class="card"><h3>这台设备上有 ${records} 条过程记录</h3><p>只包含作答结果、提示次数、核验和轮次，不包含录音、照片、真实姓名、账号或密码。</p><div class="data-actions" style="margin-top:16px"><button class="primary" data-export>导出备份</button><button class="secondary" data-import>导入恢复</button>${undoImport?`<button class="secondary" data-undo-import>撤销本次导入</button>`:""}<button class="danger-btn" data-clear>清空本机记录</button></div></section><div class="boundary"><strong>内容边界</strong><br>本产品使用通用自编衔接内容，未对齐指定教材、地区或考试。当前证据不能替代老师评估或真实儿童长期效果验证。</div>`}
function render(){nav();delete document.body.dataset.contentItemId;if(ui.contentId)return renderContent();if(ui.screen){const atom=atoms[ui.screen.atomId];if(ui.screen.phase==="teach")return renderTeach(atom);if(ui.screen.phase==="practice")return renderPractice(atom);return renderEvidence(atom)}if(ui.view==="home")return renderHome();if(["语文","数学","英语","阅读"].includes(ui.view))return renderSubject(ui.view);if(ui.view==="library")return renderLibrary();if(ui.view==="parent")return renderParent();return renderData()}
function clearAnswer(){document.querySelectorAll(".leaf-burst").forEach(node=>node.remove());ui.selection=null;ui.number="";ui.order=[];ui.feedback=null;ui.hint=false;ui.observe=[]}
function resetContentAnswer(){ui.contentSelection=null;ui.contentFeedback=null;ui.contentGuardianStarted=false;ui.contentGuardianChecks=[];ui.contentOrder=[];ui.contentNumber="";ui.contentHint=false}
function recordContent(item,correct,extra={}){ENGINE.recordContentAttempt(state,item,{correct,hint_used:ui.contentHint,path_ordinal:ENGINE.currentLearningOrdinal(state),...extra});save()}
function contentCorrect(item){const mode=item.response_mode,c=item.interaction_contract||{},answer=item.oracle.answer;if(mode==="number_input")return String(ui.contentNumber)===String(answer);if(mode==="ordered_tokens")return JSON.stringify(ui.contentOrder)===JSON.stringify(answer.map(String));if(mode==="letter_tiles")return JSON.stringify(ui.contentOrder)===JSON.stringify(c.correct_tile_ids.map(String));if(mode==="phrase_blocks")return JSON.stringify(ui.contentOrder)===JSON.stringify(c.correct_block_ids.map(String));return false}
function bindContentCanvas(){const canvas=document.querySelector(".writing-canvas");if(!canvas)return;const ctx=canvas.getContext("2d");let drawing=false;canvas.dataset.drawn="false";ctx.lineWidth=9;ctx.lineCap="round";ctx.strokeStyle="#244c35";const point=e=>{const r=canvas.getBoundingClientRect();return[(e.clientX-r.left)*canvas.width/r.width,(e.clientY-r.top)*canvas.height/r.height]};canvas.onpointerdown=e=>{drawing=true;canvas.dataset.drawn="true";canvas.setPointerCapture(e.pointerId);const[x,y]=point(e);ctx.beginPath();ctx.moveTo(x,y)};canvas.onpointermove=e=>{if(!drawing)return;const[x,y]=point(e);ctx.lineTo(x,y);ctx.stroke()};canvas.onpointerup=canvas.onpointercancel=()=>drawing=false}
function burst(){const xs=[-100,-60,-20,30,70,110],ys=[-120,-85,-140,-95,-130,-70];document.getElementById("toast-root").insertAdjacentHTML("beforeend",`<div class="leaf-burst">${xs.map((x,i)=>`<span class="leaf" style="--x:${x}px;--y:${ys[i]}px">🍃</span>`).join("")}</div>`);setTimeout(()=>document.querySelector(".leaf-burst")?.remove(),1000)}
document.addEventListener("click",e=>{const t=e.target.closest("button");if(!t)return;
if(t.dataset.view){ui.view=t.dataset.view;state.last_view=ui.view;ui.screen=null;ui.contentId=null;save();render();return goTop()}
if(t.dataset.contentLevel){ui.contentLevel=t.dataset.contentLevel;return render()}
if(t.dataset.contentHint!==undefined){ui.contentHint=true;return render()}
if(t.dataset.openContent){ui.contentOrigin=ui.view==="home"?"home":"library";ui.contentId=t.dataset.openContent;resetContentAnswer();history.replaceState(null,"",`?content=${encodeURIComponent(ui.contentId)}`);render();return goTop()}
if(t.dataset.closeContent!==undefined){ui.contentId=null;resetContentAnswer();ui.view=ui.contentOrigin==="home"?"home":"library";history.replaceState(null,"",location.pathname);render();return goTop()}
if(t.dataset.contentAnswer!==undefined){const item=contentItems[ui.contentId],answer=String(t.dataset.contentAnswer),correct=answer===String(item.oracle.answer),mis=item.error_mapping?.[answer];ui.contentSelection=answer;recordContent(item,correct,{answer,detected_misconception:mis});ui.contentFeedback={correct,result:correct?"correct":"retry",text:correct?item.oracle.explanation:item.remediation_next_action||"再看一看，换一个答案试试。"};if(correct)burst();return render()}
if(t.dataset.contentKey!==undefined){const key=t.dataset.contentKey;if(key==="清空")ui.contentNumber="";else if(key==="退格")ui.contentNumber=ui.contentNumber.slice(0,-1);else if(ui.contentNumber.length<3)ui.contentNumber+=key;return render()}
if(t.dataset.contentToken!==undefined){ui.contentOrder.push(String(t.dataset.contentToken));return render()}
if(t.dataset.contentPiece!==undefined){ui.contentOrder.push(String(t.dataset.contentPiece));return render()}
if(t.dataset.contentReset!==undefined){ui.contentOrder=[];ui.contentFeedback=null;return render()}
if(t.dataset.contentClear!==undefined){ui.contentFeedback=null;return render()}
if(t.dataset.contentSubmit!==undefined){const item=contentItems[ui.contentId];if(item.response_mode==="handwriting_canvas"){const drawn=document.querySelector(".writing-canvas")?.dataset.drawn==="true";ui.contentFeedback=drawn?{correct:true,draft:true,result:"draft_ready",text:"已经写下来了，请和下面的字对照。"}:{correct:false,result:"retry",text:"田字格还是空的，先用手指写一写。"};return render()}const correct=contentCorrect(item);recordContent(item,correct);ui.contentFeedback={correct,result:correct?"correct":"retry",text:correct?item.oracle.explanation:item.remediation_next_action||"顺序还不对，重新试一遍。"};if(correct)burst();return render()}
if(t.dataset.contentSelfConfirm!==undefined){const item=contentItems[ui.contentId];recordContent(item,true);ui.contentFeedback={correct:true,result:"practice_completed",text:item.oracle.explanation};burst();return render()}
if(t.dataset.contentChildDone!==undefined){ui.contentGuardianStarted=true;ui.contentFeedback={correct:true,result:"child_reported",text:"已记录孩子完成，现在请家长按现场观察逐项确认。"};return render()}
if(t.dataset.contentGuardianConfirm!==undefined){const item=contentItems[ui.contentId];recordContent(item,true,{guardian_confirmed:true});ui.contentFeedback={correct:true,result:"guardian_confirmed",text:item.oracle.explanation||"家长已确认过程完成。"};burst();return render()}
if(t.dataset.openAtom){const a=atoms[t.dataset.openAtom];ui.view=a.subject;ui.screen={atomId:a.atom_id,phase:evidence(a).finished?"evidence":"teach"};clearAnswer();render();return goTop()}
if(t.dataset.closeAtom!==undefined){ui.screen=null;clearAnswer();render();return goTop()}
if(t.dataset.startPractice!==undefined){ui.screen.phase="practice";clearAnswer();render();return goTop()}
if(t.dataset.option!==undefined){ui.selection=t.dataset.option;return render()}
if(t.dataset.key!==undefined){const k=t.dataset.key;if(k==="清空")ui.number="";else if(k==="删除")ui.number=ui.number.slice(0,-1);else if(ui.number.length<3)ui.number+=k;return render()}
if(t.dataset.orderAdd!==undefined){ui.order.push(t.dataset.orderAdd);return render()}
if(t.dataset.orderRemove!==undefined){ui.order=ui.order.filter(x=>x!==t.dataset.orderRemove);return render()}
if(t.dataset.hint!==undefined){ui.hint=true;return render()}
if(t.dataset.submitAnswer!==undefined){const atom=atoms[ui.screen.atomId],round=ENGINE.ensureAtomRound(state,atom.atom_id),itemIndex=round.item_index,item=atom.practice.items[itemIndex],value=answerValue(item);if((item.response_mode==="single_choice"&&!ui.selection)||(item.response_mode==="number"&&!ui.number)||(item.response_mode==="ordered_tokens"&&ui.order.length!==item.correct_answer.length)||(item.response_mode==="guardian_observation"&&ui.observe.length===0)){return toast("请先完成当前答案")};const correct=isCorrect(item,value);ENGINE.recordAttempt(state,atom,item,{correct,hint_used:ui.hint});save();ui.feedback={correct,explanation:item.explanation,itemIndex};if(correct)burst();return render()}
if(t.dataset.afterFeedback!==undefined){if(ui.feedback.correct){clearAnswer();const a=atoms[ui.screen.atomId];ui.screen.phase=ENGINE.ensureAtomRound(state,a.atom_id).finished?"evidence":"practice"}else{ui.selection=null;ui.number="";ui.order=[];ui.feedback=null;ui.observe=[]}return render()}
if(t.dataset.resetAtom){if(confirm("重新开始这个能力的当前练习吗？本轮作答与核验会被重置。")){ENGINE.resetAtomRound(state,t.dataset.resetAtom);save();ui.screen={atomId:t.dataset.resetAtom,phase:"teach"};clearAnswer();render();goTop()}return}
if(t.dataset.goParent!==undefined){ui.screen=null;ui.view="parent";state.last_view="parent";save();render();return goTop()}
if(t.dataset.showMethod!==undefined){ui.screen.phase="teach";render();return goTop()}
if(t.dataset.verify){const a=atoms[t.dataset.verify],result=ENGINE.verifyAtom(state,PRODUCT,a);save();toast(result.restored?"三项都已确认，花园防线恢复了":result.changed?"已记录家长确认":"这项确认没有重复生效");if(result.restored)burst();return render()}
if(t.dataset.nextRound!==undefined){if(ENGINE.advanceRound(state,PRODUCT)){save();toast("下一轮学习已经准备好");render();goTop()}return}
if(t.dataset.export!==undefined){const blob=new Blob([JSON.stringify({schema_version:1,format:"small-garden-learning-backup",exported_at:new Date().toISOString(),state},null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="small-garden-learning-backup.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500);return}
if(t.dataset.import!==undefined){document.getElementById("import-file").click();return}
if(t.dataset.undoImport!==undefined){state=ENGINE.normalizeState(undoImport);undoImport=null;save();toast("已撤销本次导入");return render()}
if(t.dataset.clear!==undefined){if(confirm("清空这台设备上的全部学习记录吗？此操作无法自动恢复，请先导出备份。")){state=ENGINE.createState();localStorage.removeItem(KEY);ui.view="home";ui.screen=null;ui.contentId=null;toast("本机记录已清空");render();goTop()}return}});
document.addEventListener("change",e=>{if(e.target.matches("[data-observe]")){ui.observe=[...document.querySelectorAll("[data-observe]:checked")].map(x=>x.dataset.observe);render()}if(e.target.matches("[data-content-guardian-check]")){const button=document.querySelector("[data-content-guardian-confirm]");if(button)button.disabled=!e.target.checked}if(e.target.matches("[data-content-rubric]")){ui.contentGuardianChecks=[...document.querySelectorAll("[data-content-rubric]:checked")].map(x=>String(x.dataset.contentRubric));render()}});
document.getElementById("import-file").addEventListener("change",async e=>{const file=e.target.files[0];e.target.value="";if(!file)return;if(file.size>PRODUCT.data_policy.max_import_bytes)return toast("文件超过 2 MB，未导入");try{const data=JSON.parse(await file.text());if(data.schema_version!==1||data.format!=="small-garden-learning-backup"||!data.state)throw Error("invalid");if(!confirm("导入会替换当前本机进度。继续吗？"))return;undoImport=state;state=ENGINE.normalizeState(data.state);save();ui.view="home";ui.screen=null;toast("导入完成，可以立即撤销");render()}catch(_){toast("这不是可用的小花园学习备份")}});
const directContent=new URLSearchParams(location.search).get("content");if(directContent&&contentItems[directContent]){ui.view="library";ui.contentOrigin="library";ui.contentId=directContent}document.documentElement.dataset.productReady="true";render();
})();
</script>
</body></html>
