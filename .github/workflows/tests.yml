name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  stdlib-skills:
    name: ${{ matrix.skill }} (py${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
        skill: [double6-deep-research, double6-workbench-builder]
    defaults:
      run:
        working-directory: skills/${{ matrix.skill }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest
      - run: python -m pytest -q -p no:cacheprovider tests

  workbench-browser:
    name: double6-workbench-builder browser evaluation (ubuntu, Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skills/double6-workbench-builder
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install pytest playwright
      - run: python -m playwright install --with-deps chromium
      - name: Browser evaluation (content ops, research reading, fitness)
        env:
          DOUBLE6_E2E_BROWSER: "1"
        run: python -m pytest -q -p no:cacheprovider tests -k browser -rs
      - name: Full suite with browser available
        run: python -m pytest -q -p no:cacheprovider tests

  ppt-cli:
    name: double6-ppt-cli (py${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
    defaults:
      run:
        working-directory: skills/double6-ppt-cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-core.lock pytest
      - run: python -m pytest -q -p no:cacheprovider scripts/tests
      - name: Attribution / license guard
        shell: bash
        env:
          PYTHONPATH: scripts
        run: python scripts/attribution_guard.py

  pdf-translation-linux-smoke:
    name: double6-pdf-translation Linux smoke (py3.12, setup_venv + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skills/double6-pdf-translation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install uv
      - name: Install exactly as documented (scripts/setup_venv.sh, hash-locked)
        run: PDFTR_PYTHON="$(command -v python)" bash scripts/setup_venv.sh "$RUNNER_TEMP/pdftr-venv"
      - run: uv pip install --python "$RUNNER_TEMP/pdftr-venv/bin/python" pytest
      - name: OCR route engine (Tesseract + chi_sim/eng/osd, Apache-2.0; optional for other routes)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends tesseract-ocr tesseract-ocr-eng tesseract-ocr-chi-sim tesseract-ocr-osd
          tesseract --version
          tesseract --list-langs
      - name: Unit and CLI tests (no model, no network)
        env:
          PAPER_TRANSLATION_WORKSPACE: ${{ runner.temp }}/pdftr-ws
        run: '"$RUNNER_TEMP/pdftr-venv/bin/python" -m pytest -q -p no:cacheprovider tests'
      - name: Workflow CLI help for every action
        run: |
          PY="$RUNNER_TEMP/pdftr-venv/bin/python"
          for action in inspect-input candidate collect review doctor run-reviewed-scan trial-render prepare-scan; do
            "$PY" scripts/paper_translation_workflow.py "$action" --help > /dev/null
          done

  offline-material-redaction:
    name: double6-offline-material-redaction (py${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    defaults:
      run:
        working-directory: skills/double6-offline-material-redaction
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install copied skill and verify generated launchers
        shell: bash
        run: python "$GITHUB_WORKSPACE/.github/scripts/redaction_install_smoke.py" --source . --work "$RUNNER_TEMP/redaction first use"
      - name: Preserve installation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: redaction-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            ${{ runner.temp }}/redaction first use/install-chain.json
            ${{ runner.temp }}/redaction first use/*.log
          if-no-files-found: error
